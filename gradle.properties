group = io.github.miniplaceholders
# Fork BTC de MiniPlaceholders, recale sur Paper/Folia 26.3 et publie dans le
# depot statique BTC Studio. Meme schema que le fork PlaceholderAPI qu il remplace :
#   <dernier tag amont reellement publie>-<palier Minecraft>-BTC-<iteration>
#
# Base amont : tag 3.2.0. L amont n a publie ni 3.2.1 ni 3.2.2 ; son `main` porte
# un `3.2.2-SNAPSHOT` de travail, que cette coordonnee ne revendique deliberement
# pas. Le travail amont post-3.2.0 ici integre va jusqu a 6813806 (resynchro du
# 27/10/2026), et compte comme une iteration BTC, pas comme une version amont.
version = 3.2.0-26.3-BTC-2
description = MiniMessage Component-based Placeholders API

org.gradle.jvmargs=-Xmx2G
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#org.gradle.configuration-cache=true
